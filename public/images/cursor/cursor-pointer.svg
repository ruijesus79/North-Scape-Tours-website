<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <filter id="reticleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#reticleShadow)">
    <!-- Outer Precision Diamond -->
    <polygon points="12,3 21,12 12,21 3,12" stroke="#FFF5DC" stroke-width="1.2" fill="rgba(212,175,55,0.22)"/>
    <!-- Subtle Inner Ring -->
    <circle cx="12" cy="12" r="5" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
    <!-- Cardinal Compass Rose Ticks -->
    <line x1="12" y1="0.5" x2="12" y2="3.5" stroke="#FFF5DC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="20.5" x2="12" y2="23.5" stroke="#FFF5DC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0.5" y1="12" x2="3.5" y2="12" stroke="#FFF5DC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="20.5" y1="12" x2="23.5" y2="12" stroke="#FFF5DC" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Central Luminous Core -->
    <circle cx="12" cy="12" r="2" fill="#FFFFFF"/>
  </g>
</svg>