<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="NORTHÉ — Experiências e tours 100% privados no Vale do Douro, Porto e Norte de Portugal. Degustação de vinhos raros, cruzeiros fluviais e itinerários sob medida para grupos de 1 a 8 pessoas." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>NORTHÉ | Luxury Private Tours & Experiences from Porto</title>

  <!-- Signature script font for editorial About section -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

  <!-- SEO Avançado Promax: JSON-LD Schema -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristAttraction",
        "name": "NORTHÉ - Private Tours & Experiences",
        "description": "Experiências 100% privadas exclusivas no Vale do Douro, Porto e Norte de Portugal. Degustações em quintas históricas, cruzeiros fluviais e viagens sob medida para grupos até 8 pessoas.",
        "url": "https://northetours.com",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "420.00",
          "highPrice": "1050.00",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock"
        },
        "provider": {
          "@type": "TravelAgency",
          "name": "NORTHÉ",
          "email": "info@northetours.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Porto",
            "addressCountry": "PT"
          }
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Lenis Smooth Scrolling CDN -->
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <script>
    // Initialize Lenis exactly as requested for absolute fluidity
    window.addEventListener('DOMContentLoaded', () => {
      // Wait just a brief moment for the React DOM tree to mount
      setTimeout(() => {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          direction: 'vertical',
          gestureDirection: 'vertical',
          smooth: true,
          mouseMultiplier: 1,
          smoothTouch: false,
          touchMultiplier: 2,
          infinite: false,
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);

        // Listen for React Router changes to scroll to top smoothly
        window.lenis = lenis;
      }, 100);
    });
  </script>
</body>

</html>
