  <!-- Lenis Smooth Scrolling CDN -->
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <script>
    // Initialize Lenis exactly as requested for absolute fluidity
    window.addEventListener('DOMContentLoaded', () => {
      // Wait just a brief moment for the React DOM tree to mount
      setTimeout(() => {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          direction: 'vertical',
          gestureDirection: 'vertical',
          smooth: true,
          mouseMultiplier: 1,
          smoothTouch: false,
          touchMultiplier: 2,
          infinite: false,
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);

        // Listen for React Router changes to scroll to top smoothly
        window.lenis = lenis;
      }, 100);
    });
  </script>
